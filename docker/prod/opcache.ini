; opcache.enable_cli is off by default — without it, opcache does nothing
; for the CLI SAPI processes this image runs (php artisan serve/horizon/reverb:start).
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.max_accelerated_files=10000

; The image is rebuilt on every deploy rather than having its code changed
; in place, so opcache never needs to notice a file changed on disk.
opcache.validate_timestamps=0
