# Runs the three long-lived processes this app needs in production — the
# web server, the Horizon queue worker (redis queue, see
# app/Modules/HorizonDashboard), and the Reverb WebSocket server (see
# app/Modules/JobProgress) — inside one container. All three log to
# stdout/stderr so `docker logs` (and Coolify's log viewer) captures them.
[supervisord]
nodaemon=true
; The container runs as www-data (no root, no setuid needed for any of
; these three processes), and www-data can't write to /var/run or
; /var/log — supervisord's own log/pid files go to /tmp instead, which is
; world-writable.
logfile=/tmp/supervisord.log
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=php artisan serve --host=0.0.0.0 --port=8080
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
command=php artisan horizon
autorestart=true
; Horizon needs time to finish in-flight jobs and deregister from Redis on
; SIGTERM (Laravel's own `horizon:terminate` handling) before supervisord
; escalates to SIGKILL.
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
command=php artisan reverb:start --host=0.0.0.0 --port=8081
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
